[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-backend"
version = "0.1.0"
description = "PaperTrail AI backend: arXiv ingestion, semantic search and RAG over scientific papers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pgvector>=0.3",
    "numpy>=2.0",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# onnxruntime ships without type information.
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Database tests need `docker compose up -d`; they use a separate <POSTGRES_DB>_test database.
markers = [
    "live: calls real external services (arXiv); run explicitly with `pytest -m live`",
    "model: loads the real local embedding model; run explicitly with `pytest -m model`",
]
addopts = "-m 'not live and not model'"
filterwarnings = [
    # Starlette's TestClient nudges towards httpx2; plain httpx still works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
